spring:
  application:
    name: encomendas-api
  profiles:
    default: dev
  config:
    import: optional:file:./config/secrets.properties
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/encomendas?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Africa/Maputo}
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  public-url: ${PUBLIC_URL:http://localhost:1111}
  jwt-secret: ${JWT_SECRET:}
  jwt-expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  storage: ${STORAGE:local}          # local (dev) | cloudinary (produção)
  admin:
    email: ${ADMIN_EMAIL:sgpa.notificacoes@gmail.com}
    password: ${ADMIN_PASSWORD:Mariodemario}
  order:
    max-quantity: ${MAX_QUANTITY_PER_ORDER:10}   # RN16: limite global por encomenda

cloudinary:
  url: ${CLOUDINARY_URL:}
